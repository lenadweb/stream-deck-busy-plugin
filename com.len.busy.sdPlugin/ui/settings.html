<!DOCTYPE html>
<html>

<head lang="en">
    <title>Busy Toggle</title>
    <meta charset="utf-8" />
    <style>
        :root {
            --bg: #2d2d2d;
            --input: #1a1a1a;
            --border: #3a3a3a;
            --border-strong: #555;
            --text: #e8e8e8;
            --muted: #8a8a8a;
            --free: #22c55e;
            --busy: #ef4444;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            font-size: 13px;
            -webkit-font-smoothing: antialiased;
        }

        .container { padding: 12px 14px 14px; }

        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 14px;
            border-bottom: 1px solid var(--border);
        }
        .tab {
            flex: 1;
            padding: 8px 4px;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: color .15s, border-color .15s;
        }
        .tab:hover { color: var(--text); }
        .tab[aria-selected="true"] {
            color: #fff;
            border-bottom-color: var(--text);
        }
        .panel[hidden] { display: none; }

        .group {
            --accent: #3b82f6;
            margin-bottom: 14px;
        }

        .state {
            --accent: var(--free);
            margin-bottom: 14px;
            padding-bottom: 2px;
            border-bottom: 1px solid var(--border);
        }
        .state[data-status="busy"] { --accent: var(--busy); }

        .section-title {
            display: flex;
            align-items: center;
            gap: 7px;
            margin: 0 0 10px;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
        }
        .section-title::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
        }

        .field { margin-bottom: 12px; }
        .field-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .3px;
            color: var(--muted);
            text-transform: uppercase;
        }

        .input {
            width: 100%;
            background-color: var(--input);
            color: #fff;
            border: 1px solid var(--border-strong);
            border-radius: 5px;
            padding: 7px 9px;
            font-size: 13px;
            font-family: inherit;
            transition: border-color .15s, box-shadow .15s, opacity .15s;
        }
        .input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
        }
        .input:disabled { opacity: .4; }

        .switch {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--muted);
            cursor: pointer;
        }
        .switch input {
            margin: 0;
            accent-color: var(--accent);
        }
        .switch.wide {
            margin-bottom: 12px;
            font-size: 12px;
            color: var(--text);
        }

        .hint {
            font-size: 11px;
            color: var(--muted);
            line-height: 1.4;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="tabs" role="tablist">
            <button class="tab" role="tab" data-tab="states" aria-selected="true">States</button>
            <button class="tab" role="tab" data-tab="advanced" aria-selected="false">Advanced</button>
        </div>

        <div class="panel" role="tabpanel" data-panel="states">
            <div id="states"></div>
            <div class="hint">Empty text means FREE / BUSY. The status itself is shared by every Busy Toggle key and dial.</div>
        </div>

        <div class="panel" role="tabpanel" data-panel="advanced" hidden>
            <section class="group">
                <h2 class="section-title">Auto-reset</h2>
                <label class="switch wide"><input type="checkbox" id="auto-reset-enabled" />Return to Free automatically</label>
                <div class="field">
                    <div class="field-header">
                        <label class="label" for="auto-reset-minutes">After, minutes</label>
                    </div>
                    <input class="input" type="number" id="auto-reset-minutes" min="1" max="720" step="1" placeholder="25" />
                </div>
                <label class="switch wide"><input type="checkbox" id="auto-reset-time-left" />Show time left instead of text</label>
                <div class="hint">The timer starts when this key or dial switches you to Busy. Switching back to Free by hand cancels it.</div>
            </section>
        </div>
    </div>

    <template id="state-template">
        <section class="state">
            <h2 class="section-title"></h2>
            <div class="field">
                <div class="field-header">
                    <label class="label" data-for="icon">Icon</label>
                </div>
                <select class="input" data-field="icon"></select>
            </div>
            <div class="field">
                <div class="field-header">
                    <label class="label" data-for="text">Text</label>
                    <label class="switch"><input type="checkbox" data-field="showText" />Show</label>
                </div>
                <input class="input" type="text" data-field="text" maxlength="40" />
            </div>
        </section>
    </template>

    <script>
        const STATES = [
            { status: "free", title: "Free", icon: "check", placeholder: "FREE" },
            { status: "busy", title: "Busy", icon: "no-entry", placeholder: "BUSY" },
        ];

        const ICONS = [
            { value: "check", label: "Check" },
            { value: "no-entry", label: "No entry" },
            { value: "coffee", label: "Coffee" },
            { value: "smile", label: "Smile" },
            { value: "door-open", label: "Door open" },
            { value: "headphones", label: "Headphones" },
            { value: "mic", label: "Microphone" },
            { value: "video", label: "Video call" },
            { value: "phone", label: "Phone" },
            { value: "moon", label: "Moon" },
            { value: "lock", label: "Lock" },
            { value: "bell-off", label: "Bell off" },
            { value: "none", label: "No icon" },
        ];

        const AUTO_RESET_DEFAULT_MINUTES = 25;

        const inspector = {
            websocket: null,
            context: null,
            settings: {},
            stateForms: new Map(),
            autoResetForm: null,
        };

        function connectElgatoStreamDeckSocket(port, context, registerEvent, info, actionInfo) {
            inspector.context = context;
            inspector.settings = actionInfo ? JSON.parse(actionInfo).payload?.settings ?? {} : {};
            inspector.websocket = new WebSocket("ws://127.0.0.1:" + port);

            inspector.websocket.onopen = () => {
                inspector.websocket.send(JSON.stringify({ event: registerEvent, uuid: context }));
                renderSettings();
            };

            inspector.websocket.onmessage = (message) => {
                const data = JSON.parse(message.data);
                if (data.event === "didReceiveSettings") {
                    inspector.settings = data.payload?.settings ?? {};
                    renderSettings();
                }
            };
        }

        function selectTab(name) {
            document.querySelectorAll(".tab").forEach((tab) => {
                tab.setAttribute("aria-selected", String(tab.dataset.tab === name));
            });
            document.querySelectorAll(".panel").forEach((panel) => {
                panel.hidden = panel.dataset.panel !== name;
            });
        }

        function createStateForm(state) {
            const section = document.getElementById("state-template").content.firstElementChild.cloneNode(true);
            section.dataset.status = state.status;
            section.querySelector(".section-title").textContent = state.title;

            const fields = {
                icon: section.querySelector('[data-field="icon"]'),
                showText: section.querySelector('[data-field="showText"]'),
                text: section.querySelector('[data-field="text"]'),
            };

            ICONS.forEach(({ value, label }) => fields.icon.add(new Option(label, value)));
            fields.text.placeholder = state.placeholder;

            section.querySelectorAll("[data-for]").forEach((label) => {
                const id = `${state.status}-${label.dataset.for}`;
                fields[label.dataset.for].id = id;
                label.htmlFor = id;
            });

            fields.icon.addEventListener("change", saveSettings);
            fields.showText.addEventListener("change", saveSettings);
            fields.text.addEventListener("input", saveSettings);

            return { section, fields };
        }

        function createAutoResetForm() {
            const fields = {
                enabled: document.getElementById("auto-reset-enabled"),
                minutes: document.getElementById("auto-reset-minutes"),
                showTimeLeft: document.getElementById("auto-reset-time-left"),
            };

            fields.enabled.addEventListener("change", saveSettings);
            fields.minutes.addEventListener("input", saveSettings);
            fields.showTimeLeft.addEventListener("change", saveSettings);

            return { fields };
        }

        function renderStateForm({ fields }, state) {
            const current = inspector.settings[state.status] ?? {};
            fields.icon.value = current.icon ?? state.icon;
            fields.showText.checked = current.showText !== false;
            fields.text.value = current.text ?? "";
            fields.text.disabled = !fields.showText.checked;
        }

        function renderAutoResetForm({ fields }) {
            const current = inspector.settings.autoReset ?? {};
            fields.enabled.checked = current.enabled === true;
            fields.minutes.value = current.minutes ?? AUTO_RESET_DEFAULT_MINUTES;
            fields.showTimeLeft.checked = current.showTimeLeft !== false;
            fields.minutes.disabled = !fields.enabled.checked;
        }

        function renderSettings() {
            STATES.forEach((state) => renderStateForm(inspector.stateForms.get(state.status), state));
            renderAutoResetForm(inspector.autoResetForm);
        }

        function readStateForm({ fields }) {
            fields.text.disabled = !fields.showText.checked;
            return {
                icon: fields.icon.value,
                showText: fields.showText.checked,
                text: fields.text.value.trim(),
            };
        }

        function readAutoResetForm({ fields }) {
            const minutes = Number.parseInt(fields.minutes.value, 10);
            fields.minutes.disabled = !fields.enabled.checked;
            return {
                enabled: fields.enabled.checked,
                minutes: Number.isFinite(minutes) ? minutes : AUTO_RESET_DEFAULT_MINUTES,
                showTimeLeft: fields.showTimeLeft.checked,
            };
        }

        function saveSettings() {
            inspector.settings = {
                ...Object.fromEntries(STATES.map(({ status }) => [status, readStateForm(inspector.stateForms.get(status))])),
                autoReset: readAutoResetForm(inspector.autoResetForm),
            };
            inspector.websocket?.send(JSON.stringify({
                event: "setSettings",
                context: inspector.context,
                payload: inspector.settings,
            }));
        }

        document.querySelectorAll(".tab").forEach((tab) => {
            tab.addEventListener("click", () => selectTab(tab.dataset.tab));
        });

        STATES.forEach((state) => {
            const form = createStateForm(state);
            inspector.stateForms.set(state.status, form);
            document.getElementById("states").appendChild(form.section);
        });

        inspector.autoResetForm = createAutoResetForm();

        renderSettings();
    </script>
</body>

</html>
